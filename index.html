
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTEN Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f0e8;
      color: #40392f;
      margin: 0;
      padding: 24px 16px;
      text-align: center;
    }

    .kad {
      background: white;
      max-width: 420px;
      margin: 20px auto;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 2px 10px #00000012;
    }

    h1 { font-size: 25px; }

    button {
      background: #74664b;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 16px;
      width: 100%;
      margin-top: 10px;
    }

    #reader {
      width: 100%;
      margin-top: 16px;
    }

    #status {
      margin-top: 18px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="kad">
    <h1>MTEN Scanner</h1>
    <p>Sistem Imbasan Kehadiran Pelajar</p>

    <button onclick="mula()">Mula Imbasan</button>
    <button onclick="henti()">Hentikan Kamera</button>

    <div id="reader"></div>
    <div id="status">Pengimbas belum dimulakan.</div>
  </div>

  <script>
    let pengimbas = null;
    let aktif = false;

    async function mula() {
      const status = document.getElementById("status");

      if (aktif) return;

      try {
        status.textContent = "Meminta kebenaran kamera...";

        pengimbas = new Html5Qrcode("reader");

        await pengimbas.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
        async (teksQR) => {
  await henti();

  let idPelajar = "";

  try {
    const urlQR = new URL(teksQR);
    idPelajar = urlQR.searchParams.get("id") || "";
  } catch (ralat) {
    idPelajar = teksQR.trim();
  }

  if (!idPelajar) {
    document.getElementById("status").textContent =
      "ID pelajar tidak ditemui dalam QR.";
    return;
  }

  document.getElementById("status").textContent =
    "QR dibaca. Menguji sambungan...";

  try {
    const respons = await fetch(
      "https://script.google.com/a/macros/moe-dl.edu.my/s/AKfycbyBHmHPYY5JSbH6m1kw-U3dsN0yFso6xVzA3oN7w3TdS0z-1rYxbyo8Jz6AnWaXuHQ3hA/exec",
      {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({ idPelajar: idPelajar })
      }
    );

    const hasil = await respons.json();

    document.getElementById("status").textContent =
      hasil.mesej || "Respons diterima.";
  } catch (ralat) {
    document.getElementById("status").textContent =
      "Sambungan gagal. Sila semak akses Web App.";
    console.error(ralat);
  }
},
          () => {}
        );

        aktif = true;
        status.textContent = "Kamera aktif. Halakan kamera ke QR ujian.";
      } catch (ralat) {
        status.textContent = "Ralat kamera: " + String(ralat);
      }
    }

    async function henti() {
      if (pengimbas && aktif) {
        try {
          await pengimbas.stop();
          pengimbas.clear();
        } catch (ralat) {
          console.log(ralat);
        }
      }

      aktif = false;
    }
  </script>
</body>
</html>
